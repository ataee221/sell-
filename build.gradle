plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
version = '1.0.0'
group = 'com.example.selectivesell'
base { archivesName = 'SelectiveSell-Fabric-1.21.11' }
repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.11'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.18.1'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }


tasks.withType(JavaCompile).configureEach { options.release = 21 }
